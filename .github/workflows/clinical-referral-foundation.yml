name: Clinical Referral Foundation

on:
  pull_request:
    paths:
      - 'supabase-migrations/20260912_clinical_referral_foundation.sql'
      - 'supabase-verifiers/VERIFY_20260912_CLINICAL_REFERRAL_FOUNDATION.sql'
      - 'tests/sql/clinical_referral_foundation_cases.sql'
      - 'scripts/test-clinical-referral-foundation.sh'
      - 'docs/CLINICAL_REFERRAL_FOUNDATION.md'
      - 'docs/CLINICAL_DOCUMENTS_ROADMAP.md'
      - 'docs/CURRENT_STATE.md'
      - '.github/workflows/clinical-referral-foundation.yml'
  workflow_dispatch:

jobs:
  application-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  postgres16-regressions:
    name: PostgreSQL 16 — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: D2-E0 referral foundation
            database: clinical_referral_foundation_test
            script: scripts/test-clinical-referral-foundation.sh
          - name: D2-D2 exam order renderer v1
            database: clinical_exam_order_renderer_v1_test
            script: scripts/test-clinical-exam-order-renderer-v1.sh
          - name: clinical authorization reconciliation
            database: clinical_authorization_reconciliation_test
            script: scripts/test-clinical-authorization-reconciliation.sh
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated database
        env:
          PGDATABASE: postgres
        run: createdb '${{ matrix.database }}'
      - name: Run regression
        run: bash '${{ matrix.script }}'
