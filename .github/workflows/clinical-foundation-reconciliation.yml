name: Clinical Foundation Reconciliation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/components/ClinicalAssessmentRunner.tsx'
      - 'src/components/ClinicalWorkspace.tsx'
      - 'src/lib/repository.ts'
      - 'src/lib/professionalReference.ts'
      - 'supabase-migrations/20260908_clinical_foundation_reconciliation.sql'
      - 'supabase-verifiers/VERIFY_20260908_CLINICAL_FOUNDATION_RECONCILIATION.sql'
      - 'tests/sql/clinical_foundation_reconciliation_*.sql'
      - 'scripts/test-clinical-foundation-reconciliation.sh'
      - '.github/workflows/clinical-foundation-reconciliation.yml'
  workflow_dispatch:

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clinical_foundation_reconciliation_test

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated PostgreSQL 16 test database
        env:
          PGDATABASE: postgres
        run: createdb clinical_foundation_reconciliation_test

      - name: Run clinical foundation reconciliation PostgreSQL 16 gate
        run: bash scripts/test-clinical-foundation-reconciliation.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
