name: Clinical Instrument Encounter Authorization

on:
  pull_request:
    paths:
      - 'src/components/TeamAdmin.tsx'
      - 'src/lib/professionalIdentity.ts'
      - 'src/lib/teamProfessionalSettings.test.js'
      - 'supabase/functions/admin-team/index.ts'
      - 'supabase-migrations/20260910_clinical_instrument_encounter_authorization.sql'
      - 'supabase-migrations/20260910_encounter_temporal_start_boundary.sql'
      - 'supabase-verifiers/VERIFY_20260910_CLINICAL_INSTRUMENT_ENCOUNTER_AUTHORIZATION.sql'
      - 'supabase-verifiers/VERIFY_20260910_ENCOUNTER_TEMPORAL_START_BOUNDARY.sql'
      - 'tests/sql/clinical_instrument_encounter_authorization_cases.sql'
      - 'tests/sql/clinical_instrument_exposure_negative_cases.sql'
      - 'scripts/build-clinical-instrument-encounter-sql-test.py'
      - 'scripts/test-clinical-instrument-encounter-authorization.sh'
      - 'docs/CLINICAL_INSTRUMENT_ENCOUNTER_AUTHORIZATION.md'
      - 'docs/CURRENT_STATE.md'
      - 'TODO.md'
      - 'PRODUCT_ROADMAP.md'
      - 'AGENTS.md'
      - '.github/workflows/clinical-instrument-encounter-authorization.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/TeamAdmin.tsx'
      - 'src/lib/professionalIdentity.ts'
      - 'src/lib/teamProfessionalSettings.test.js'
      - 'supabase/functions/admin-team/index.ts'
      - 'supabase-migrations/20260910_clinical_instrument_encounter_authorization.sql'
      - 'supabase-migrations/20260910_encounter_temporal_start_boundary.sql'
      - 'supabase-verifiers/VERIFY_20260910_CLINICAL_INSTRUMENT_ENCOUNTER_AUTHORIZATION.sql'
      - 'supabase-verifiers/VERIFY_20260910_ENCOUNTER_TEMPORAL_START_BOUNDARY.sql'
      - 'tests/sql/clinical_instrument_encounter_authorization_cases.sql'
      - 'tests/sql/clinical_instrument_exposure_negative_cases.sql'
      - 'scripts/build-clinical-instrument-encounter-sql-test.py'
      - 'scripts/test-clinical-instrument-encounter-authorization.sh'
      - 'docs/CLINICAL_INSTRUMENT_ENCOUNTER_AUTHORIZATION.md'
      - 'docs/CURRENT_STATE.md'
      - 'TODO.md'
      - 'PRODUCT_ROADMAP.md'
      - 'AGENTS.md'
      - '.github/workflows/clinical-instrument-encounter-authorization.yml'
  workflow_dispatch:

jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clinical_instrument_encounter_authorization_test

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated PostgreSQL 16 test database
        env:
          PGDATABASE: postgres
        run: createdb clinical_instrument_encounter_authorization_test

      - name: 'Run #399 matrix on effective #399 -> #400 stack'
        run: bash scripts/test-clinical-instrument-encounter-authorization.sh
