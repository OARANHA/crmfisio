name: Clinician-Assisted Clinical Instruments V1

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/clinical-instrument-engine.ts'
      - 'supabase/functions/nexus-self-assessment-processor/index.ts'
      - 'supabase/functions/clinical-instrument-clinician-assisted/index.ts'
      - 'supabase-migrations/20260910_clinical_instrument_encounter_authorization.sql'
      - 'supabase-migrations/20260910_encounter_temporal_start_boundary.sql'
      - 'supabase-migrations/20260913_clinician_assisted_clinical_instruments_v1.sql'
      - 'supabase-migrations/20260912_clinical_care_relationship_read_reconciliation.sql'
      - 'supabase-migrations/20260915_clinician_assisted_instrument_history_v1.sql'
      - 'supabase-verifiers/VERIFY_20260915_CLINICIAN_ASSISTED_INSTRUMENT_HISTORY_V1.sql'
      - 'tests/sql/clinician_assisted_instrument_history_v1_cases.sql'
      - 'src/lib/clinicalInstrumentClinicianAssisted.ts'
      - 'src/lib/clinicalInstrumentHistoryBoundary.test.js'
      - 'src/components/ClinicianAssistedInstrumentHistory.tsx'
      - 'src/components/ClinicianAssistedInstrumentWorkspace.tsx'
      - 'src/components/ClinicianAssistedInstrumentApplyNow.tsx'
      - 'src/components/ClinicalEncounterWorkspaceV4.tsx'
      - 'src/components/ClinicalWorkspaceV3.tsx'
      - 'supabase-verifiers/VERIFY_20260910_CLINICAL_INSTRUMENT_ENCOUNTER_AUTHORIZATION.sql'
      - 'supabase-verifiers/VERIFY_20260913_CLINICIAN_ASSISTED_CLINICAL_INSTRUMENTS_V1.sql'
      - 'tests/sql/clinician_assisted_clinical_instruments_v1_cases.sql'
      - 'scripts/build-clinical-instrument-encounter-sql-test.py'
      - 'scripts/build-clinician-assisted-instrument-v1-sql-test.py'
      - 'scripts/test-clinician-assisted-instrument-v1.sh'
      - 'src/lib/clinicalInstrumentServerEngine.test.ts'
      - 'src/lib/clinicalInstrumentClinicianAssistedBoundary.test.js'
      - 'docs/CLINICIAN_ASSISTED_CLINICAL_INSTRUMENTS_V1.md'
      - 'docs/CLINICIAN_ASSISTED_INSTRUMENT_HISTORY_V1.md'
      - 'docs/CURRENT_STATE.md'
      - 'TODO.md'
      - 'PRODUCT_ROADMAP.md'
      - '.github/workflows/clinician-assisted-clinical-instruments-v1.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/clinical-instrument-engine.ts'
      - 'supabase/functions/nexus-self-assessment-processor/index.ts'
      - 'supabase/functions/clinical-instrument-clinician-assisted/index.ts'
      - 'supabase-migrations/20260913_clinician_assisted_clinical_instruments_v1.sql'
      - 'supabase-migrations/20260912_clinical_care_relationship_read_reconciliation.sql'
      - 'supabase-migrations/20260915_clinician_assisted_instrument_history_v1.sql'
      - 'supabase-verifiers/VERIFY_20260915_CLINICIAN_ASSISTED_INSTRUMENT_HISTORY_V1.sql'
      - 'tests/sql/clinician_assisted_instrument_history_v1_cases.sql'
      - 'src/lib/clinicalInstrumentClinicianAssisted.ts'
      - 'src/lib/clinicalInstrumentHistoryBoundary.test.js'
      - 'src/components/ClinicianAssistedInstrumentHistory.tsx'
      - 'src/components/ClinicianAssistedInstrumentWorkspace.tsx'
      - 'src/components/ClinicianAssistedInstrumentApplyNow.tsx'
      - 'src/components/ClinicalEncounterWorkspaceV4.tsx'
      - 'src/components/ClinicalWorkspaceV3.tsx'
      - 'supabase-verifiers/VERIFY_20260913_CLINICIAN_ASSISTED_CLINICAL_INSTRUMENTS_V1.sql'
      - 'tests/sql/clinician_assisted_clinical_instruments_v1_cases.sql'
      - 'scripts/build-clinician-assisted-instrument-v1-sql-test.py'
      - 'scripts/test-clinician-assisted-instrument-v1.sh'
      - 'src/lib/clinicalInstrumentServerEngine.test.ts'
      - 'src/lib/clinicalInstrumentClinicianAssistedBoundary.test.js'
      - 'docs/CLINICIAN_ASSISTED_CLINICAL_INSTRUMENTS_V1.md'
      - 'docs/CLINICIAN_ASSISTED_INSTRUMENT_HISTORY_V1.md'
      - 'docs/CURRENT_STATE.md'
      - 'TODO.md'
      - 'PRODUCT_ROADMAP.md'
      - '.github/workflows/clinician-assisted-clinical-instruments-v1.yml'
  workflow_dispatch:

jobs:
  clinician-assisted-v1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clinician_assisted_instrument_v1_test

    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated PostgreSQL 16 test database
        env:
          PGDATABASE: postgres
        run: createdb clinician_assisted_instrument_v1_test
      - name: Run clinician-assisted administration V1 gate
        run: bash scripts/test-clinician-assisted-instrument-v1.sh
