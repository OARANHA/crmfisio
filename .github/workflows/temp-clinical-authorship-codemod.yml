name: Temporary clinical authorship codemod

on:
  push:
    branches:
      - security/p0-appointment-clinical-authorship
    paths:
      - .github/workflows/temp-clinical-authorship-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/p0-appointment-clinical-authorship
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply clinical self-transition UI boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/ClinicalWorkspace.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const replacements = [
            ["import { isClinicManager } from '../lib/permissions';", "import { canTransitionClinicalAppointment, isClinicManager } from '../lib/permissions';"],
            ["  const documentWrite = user?.role === 'fisio' || isClinicManager(user?.role) || user?.role === 'recep';", "  const documentWrite = user?.role === 'fisio' || isClinicManager(user?.role) || user?.role === 'recep';\n  const canTransitionSession = (session: Appointment) => canTransitionClinicalAppointment(user?.role, user?.id, session.fisioId);"],
            ["    if (!clinicalWrite || transitioningSessionId) return false;", "    if (!canTransitionSession(session) || transitioningSessionId) return false;"],
            ["    if (!clinicalWrite) return;\n    const accepted = await transitionSession(session, 'em_atendimento');", "    if (!canTransitionSession(session)) return;\n    const accepted = await transitionSession(session, 'em_atendimento');"],
            ["    if (!clinicalWrite) return;\n    const hasEvolution = evolutions.some((e) => e.sessionId === session.id);", "    if (!canTransitionSession(session)) return;\n    const hasEvolution = evolutions.some((e) => e.sessionId === session.id);"],
            ["{sessions.filter((s) => !['faltou', 'cancelado'].includes(s.status)).map((s) => <option", "{sessions.filter((s) => canTransitionSession(s) && s.status === 'em_atendimento').map((s) => <option"],
            ["{clinicalWrite && ['agendado', 'confirmado'].includes(session.status) && <Btn", "{canTransitionSession(session) && ['agendado', 'confirmado'].includes(session.status) && <Btn"],
            ["{clinicalWrite && session.status === 'em_atendimento' && <Btn", "{canTransitionSession(session) && session.status === 'em_atendimento' && <Btn"],
          ];
          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error(`Expected source fragment not found: ${from}`);
            s = s.replace(from, to);
          }
          fs.writeFileSync(path, s);
          NODE
      - name: Commit codemod result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/ClinicalWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "security: enforce assigned professional in clinical UI"
          git push origin HEAD:security/p0-appointment-clinical-authorship
