name: Assessment Custom Authoring ACL Hardening

on:
  pull_request:
    paths:
      - 'supabase-migrations/20260911_assessment_custom_authoring_fail_closed.sql'
      - 'supabase-verifiers/VERIFY_20260911_ASSESSMENT_CUSTOM_AUTHORING_FAIL_CLOSED_PRODUCTION.sql'
      - 'tests/sql/assessment_custom_authoring_acl_upgrade_fixture.sql'
      - '.github/workflows/assessment-custom-authoring-acl-hardening.yml'
  workflow_dispatch:

jobs:
  postgres-16-upgrade-state:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: assessment_acl_upgrade_test }
    steps:
      - uses: actions/checkout@v7
      - run: createdb "$PGDATABASE"
      - run: psql -v ON_ERROR_STOP=1 -X -f tests/sql/assessment_custom_authoring_acl_upgrade_fixture.sql
      - name: Apply upgrade migration and prove ACL drift is removed
        run: |
          psql -v ON_ERROR_STOP=1 -X -f supabase-migrations/20260911_assessment_custom_authoring_fail_closed.sql
          psql -v ON_ERROR_STOP=1 -X <<'SQL'
          DO $$ BEGIN
            IF has_function_privilege('anon','public.require_assessment_template_manager()','EXECUTE')
               OR has_function_privilege('authenticated','public.assessment_custom_authoring_allowed(uuid)','EXECUTE')
               OR has_function_privilege('authenticated','public.guard_custom_assessment_template_entitlement()','EXECUTE')
               OR has_function_privilege('authenticated','public.guard_custom_assessment_version_entitlement()','EXECUTE') THEN
              RAISE EXCEPTION 'legacy_acl_drift_survived_upgrade';
            END IF;
            IF NOT has_function_privilege('authenticated','public.require_assessment_template_manager()','EXECUTE') THEN
              RAISE EXCEPTION 'manager_rpc_acl_missing_after_upgrade';
            END IF;
          END $$;
          SQL
      - name: Run production-safe verifier
        run: psql -v ON_ERROR_STOP=1 -X -f supabase-verifiers/VERIFY_20260911_ASSESSMENT_CUSTOM_AUTHORING_FAIL_CLOSED_PRODUCTION.sql
