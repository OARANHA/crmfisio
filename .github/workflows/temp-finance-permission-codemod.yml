name: Temporary financial permission codemod

on:
  push:
    branches:
      - refactor/p1-use-financial-operation-permissions

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/p1-use-financial-operation-permissions
      - name: Apply deterministic permission replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/FinanceiroOperational.tsx')
          text = path.read_text()

          replacements = [
            (
              "import { isClinicManager } from '../lib/permissions';",
              "import {\n  canManageCommissions,\n  canManagePackageCatalog,\n  canSellSessionPackage,\n  canViewCommissions,\n  canViewFinancialPayables,\n  canWriteFinancialTransaction,\n} from '../lib/permissions';",
            ),
            (
              "  const isRecep = user?.role === 'recep';\n  const isFisio = user?.role === 'fisio';\n  const isAdmin = isClinicManager(user?.role);\n  const isFinance = user?.role === 'financeiro';\n  const canOperatePackages = !isFisio && access('financeiro') === 'full';\n  const canWriteTipo = (tipo: 'receber' | 'pagar') => access('financeiro') === 'full' && (isAdmin || isFinance || (isRecep && tipo === 'receber'));",
              "  const role = user?.role;\n  const isFisio = role === 'fisio';\n  const canWriteTipo = (tipo: 'receber' | 'pagar') => access('financeiro') === 'full' && canWriteFinancialTransaction(role, tipo);\n  const canOperatePackages = access('financeiro') === 'full' && canSellSessionPackage(role);\n  const canManageCatalog = access('financeiro') === 'full' && canManagePackageCatalog(role);\n  const canViewRepasse = canViewCommissions(role);\n  const canManageRepasse = access('financeiro') === 'full' && canManageCommissions(role);",
            ),
            ("...(!isRecep ? [{ k: 'pagar', l: 'A pagar' }] : [])", "...(canViewFinancialPayables(role) ? [{ k: 'pagar', l: 'A pagar' }] : [])"),
            ("...(!isRecep ? [{ k: 'repasse', l: 'Comissões / Repasse' }] : [])", "...(canViewRepasse ? [{ k: 'repasse', l: 'Comissões / Repasse' }] : [])"),
            ("{isAdmin && <Btn onClick={() => { setTab('pacotes'); setPackageModal('new'); }}>", "{canManageCatalog && <Btn onClick={() => { setTab('pacotes'); setPackageModal('new'); }}>") ,
            ("right={isAdmin ? <Btn className=\"!px-3 !py-1.5 !text-[11px]\" onClick={() => setPackageModal('new')}", "right={canManageCatalog ? <Btn className=\"!px-3 !py-1.5 !text-[11px]\" onClick={() => setPackageModal('new')}"),
            ("{isAdmin && <Btn variant=\"ghost\" className=\"!px-2.5 !py-1 !text-[11px]\" onClick={() => setPackageModal(pk)}>", "{canManageCatalog && <Btn variant=\"ghost\" className=\"!px-2.5 !py-1 !text-[11px]\" onClick={() => setPackageModal(pk)}>") ,
            ("{tab === 'repasse' && !isRecep && <Card", "{tab === 'repasse' && canViewRepasse && <Card"),
            ("right={isAdmin ? <Btn className=\"!px-3 !py-1.5 !text-[12px]\" onClick={() => setRepasse(true)}>", "right={canManageRepasse ? <Btn className=\"!px-3 !py-1.5 !text-[12px]\" onClick={() => setRepasse(true)}>") ,
            ("{isAdmin && <th className=\"px-4 py-3\" />}", "{canManageRepasse && <th className=\"px-4 py-3\" />}") ,
            ("{isAdmin && <td className=\"px-4 py-3 text-right\">", "{canManageRepasse && <td className=\"px-4 py-3 text-right\">") ,
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected pattern not found: {old[:100]}')
            text = text.replace(old, new)

          if 'isAdmin' in text or 'isRecep' in text or 'isFinance' in text:
            raise SystemExit('Legacy role booleans remain after codemod')

          path.write_text(text)
      - name: Commit codemod if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No codemod changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FinanceiroOperational.tsx
          git commit -m "refactor: use canonical financial permissions"
          git push origin HEAD:refactor/p1-use-financial-operation-permissions
