name: Clinical Prescription Renderer V2

on:
  pull_request:
    paths:
      - 'supabase-migrations/20260912_clinical_prescription_renderer_v2.sql'
      - 'supabase-verifiers/VERIFY_20260912_CLINICAL_PRESCRIPTION_RENDERER_V2.sql'
      - 'tests/sql/clinical_prescription_renderer_v2_*.sql'
      - 'scripts/test-clinical-prescription-renderer-v2.sh'
      - 'src/lib/prescriptionPrintRenderer.ts'
      - 'src/lib/prescriptionPrintRenderer.test.ts'
      - 'src/lib/clinicalPrescription.ts'
      - 'src/lib/clinicalDocumentTemplates.ts'
      - 'src/components/PrescriptionDocumentPreview.tsx'
      - 'src/components/ClinicalPrescriptionWorkspace.tsx'
      - 'src/components/PrescriptionTemplatesAdmin.tsx'
      - 'docs/CLINICAL_PRESCRIPTION_RENDERER_V2.md'
      - 'docs/CLINICAL_DOCUMENTS_ROADMAP.md'
      - 'docs/CURRENT_STATE.md'
      - '.github/workflows/clinical-prescription-renderer-v2.yml'
  workflow_dispatch:

jobs:
  application-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  postgres16-regressions:
    name: PostgreSQL 16 — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: D2-B.2C prescription renderer v2
            database: clinical_prescription_renderer_v2_test
            script: scripts/test-clinical-prescription-renderer-v2.sh
          - name: D2-B.2A prescription template admin
            database: clinical_document_template_admin_test
            script: scripts/test-clinical-document-template-admin.sh
          - name: D2-A documents canonical runtime
            database: clinical_documents_foundation_test
            script: scripts/test-clinical-documents-foundation.sh
          - name: care relationship read #426
            database: clinical_care_read_test
            script: scripts/test-clinical-care-relationship-read-reconciliation.sh
          - name: clinical authorization reconciliation
            database: clinical_authorization_reconciliation_test
            script: scripts/test-clinical-authorization-reconciliation.sh
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated database
        env:
          PGDATABASE: postgres
        run: createdb '${{ matrix.database }}'
      - name: Run regression
        run: bash '${{ matrix.script }}'