name: P0 custom assessment entitlement UI codemod

on:
  push:
    branches:
      - fix/p0-custom-assessment-entitlement-ui

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-custom-assessment-entitlement-ui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Align assessment authoring UI with entitlement
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/AssessmentTemplatesAdmin.tsx')
          text = path.read_text()

          text = text.replace(
              "import { isClinicManager } from '../lib/permissions';",
              "import { isClinicManager } from '../lib/permissions';\nimport { isCurrentClinicEntitlementAllowed, loadCurrentClinicEntitlementState } from '../lib/clinicEntitlement';",
          )
          text = text.replace(
              "  const [specialty, setSpecialty] = useState('fisioterapia');\n\n  const canManage = isClinicManager(user?.role);",
              "  const [specialty, setSpecialty] = useState('fisioterapia');\n  const [customAuthoringAllowed, setCustomAuthoringAllowed] = useState<boolean | null>(null);\n  const [customAuthoringError, setCustomAuthoringError] = useState(false);\n\n  const canManage = isClinicManager(user?.role);\n  const canAuthorCustomAssessments = canManage && customAuthoringAllowed === true;",
          )
          anchor = "  useEffect(() => {\n    if (!user?.id || !canManage) {\n      setLoading(false);\n      return;\n    }\n    void load();\n  }, [user?.id, canManage, load]);\n"
          addition = anchor + "\n  useEffect(() => {\n    let active = true;\n    setCustomAuthoringAllowed(null);\n    setCustomAuthoringError(false);\n    if (!user?.id || !canManage) return () => { active = false; };\n\n    void loadCurrentClinicEntitlementState('assessments.custom')\n      .then((state) => {\n        if (active) setCustomAuthoringAllowed(isCurrentClinicEntitlementAllowed(state));\n      })\n      .catch((error) => {\n        console.error('[MedicsPro] entitlement de avaliações customizadas:', error);\n        if (active) {\n          setCustomAuthoringAllowed(false);\n          setCustomAuthoringError(true);\n        }\n      });\n\n    return () => { active = false; };\n  }, [user?.id, canManage]);\n"
          if anchor not in text:
              raise SystemExit('load effect anchor not found')
          text = text.replace(anchor, addition)

          text = text.replace(
              '<Btn className="ml-auto" onClick={createNew} disabled={busy}>+ Nova avaliação</Btn>',
              '<Btn className="ml-auto" onClick={createNew} disabled={busy || !canAuthorCustomAssessments}>+ Nova avaliação</Btn>',
          )
          text = text.replace(
              "        </div>\n\n        {loading ? <div className=\"font-mono text-[11px] text-fog\">Carregando modelos…</div> : (",
              "        </div>\n\n        {customAuthoringAllowed === null && !customAuthoringError && <div className=\"rounded-xl border border-line bg-deep px-4 py-3 text-[11px] text-fog\">Validando liberação para avaliações customizadas…</div>}\n        {customAuthoringAllowed === false && <div className=\"rounded-xl border border-amber/35 bg-amber/5 px-4 py-3 text-[11px] leading-relaxed text-fog\"><strong className=\"text-amber\">Autoria personalizada indisponível.</strong> {customAuthoringError ? 'Não foi possível confirmar o entitlement; por segurança, as ações de autoria ficaram bloqueadas.' : 'O Platform Admin bloqueou avaliações customizadas para esta clínica.'} Avaliações padrão e modelos existentes continuam visíveis.</div>}\n\n        {loading ? <div className=\"font-mono text-[11px] text-fog\">Carregando modelos…</div> : (",
          )
          text = text.replace(
              '<TemplateCard key={template.id} template={template} action="Usar como base" onAction={() => duplicateStandard(template)} busy={busy} />',
              '<TemplateCard key={template.id} template={template} action="Usar como base" onAction={() => duplicateStandard(template)} busy={busy || !canAuthorCustomAssessments} />',
          )
          text = text.replace(
              '                  busy={busy}\n                />',
              '                  busy={busy || !canAuthorCustomAssessments}\n                />',
          )

          required = [
              "loadCurrentClinicEntitlementState('assessments.custom')",
              'canAuthorCustomAssessments',
              'Autoria personalizada indisponível.',
              'busy={busy || !canAuthorCustomAssessments}',
          ]
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(f'codemod incomplete: {missing}')
          path.write_text(text)
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AssessmentTemplatesAdmin.tsx
          git commit -m "fix: enforce custom assessment entitlement in UI"
          git push origin HEAD:fix/p0-custom-assessment-entitlement-ui
