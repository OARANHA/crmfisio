name: Temporary audit diagnostic

on:
  push:
    branches:
      - chore/p1-audit-moderates

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full npm audit diagnostic
        shell: bash
        run: npm audit || true
