name: Nexus C-01 PostgreSQL RLS

on:
  pull_request:
  workflow_dispatch:

jobs:
  nexus-c01-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nexus_c01_disposable_test
          POSTGRES_DB: nexus_c01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_c01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: nexus_c01_disposable_test
      PGDATABASE: nexus_c01_test
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Reproduce regression, test RLS and reject verifier drift
        run: bash scripts/test-nexus-c01.sh
