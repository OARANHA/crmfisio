name: Updated At Helper Reconciliation

on:
  pull_request:
    paths:
      - 'supabase-migrations/20260927_updated_at_helper_reconciliation.sql'
      - 'supabase-verifiers/VERIFY_20260927_UPDATED_AT_HELPER_RECONCILIATION.sql'
      - 'scripts/test-updated-at-helper-reconciliation.sh'
      - '.github/workflows/updated-at-helper-reconciliation.yml'
  workflow_dispatch:

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: updated_at_helper_reconciliation_test
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated database
        run: createdb -h localhost -U postgres updated_at_helper_reconciliation_test
      - name: Run updated_at helper reconciliation proof
        run: bash scripts/test-updated-at-helper-reconciliation.sh
