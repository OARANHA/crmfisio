name: Financial Exception Resolution

on:
  pull_request:
    paths:
      - 'supabase-migrations/20260909_financial_exception_resolution.sql'
      - 'supabase-verifiers/VERIFY_20260909_FINANCIAL_EXCEPTION_RESOLUTION.sql'
      - 'tests/sql/financial_exception_resolution_*.sql'
      - 'scripts/test-financial-exception-resolution.sh'
      - '.github/workflows/financial-exception-resolution.yml'
      - 'src/lib/financeContext.tsx'
      - 'src/lib/permissions.ts'
      - 'src/lib/repository.ts'
      - 'src/lib/financialExceptionResolution*'
      - 'src/pages/FinanceiroOperational.tsx'
      - 'supabase-verifiers/VERIFY_20260910_CLINICAL_ENCOUNTER_RECORD_PRODUCTION.sql'
  workflow_dispatch:

jobs:
  resolution:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: financial_exception_resolution_test

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated PostgreSQL 16 test database
        env:
          PGDATABASE: postgres
        run: createdb financial_exception_resolution_test

      - name: Run financial exception resolution PostgreSQL 16 gate
        run: bash scripts/test-financial-exception-resolution.sh
