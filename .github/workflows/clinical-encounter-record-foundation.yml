name: Clinical Encounter Record Foundation

on:
  pull_request:
    paths:
      - 'src/components/ClinicalEncounterRecordEditor.tsx'
      - 'src/components/ClinicalEncounterWorkspaceV4.tsx'
      - 'src/lib/clinicalEncounterRecord.ts'
      - 'src/lib/clinicalEncounterRecord*.test.*'
      - 'src/lib/activeClinicalEncounterWorkspaceBoundary.test.js'
      - 'src/lib/clinicalEncounterPersistenceBoundary.test.js'
      - 'src/lib/repository.ts'
      - 'supabase-migrations/20260910_clinical_encounter_record_foundation.sql'
      - 'supabase-migrations/20260910_clinical_instrument_encounter_authorization.sql'
      - 'supabase-verifiers/VERIFY_20260910_CLINICAL_ENCOUNTER_RECORD_FOUNDATION.sql'
      - 'supabase-verifiers/VERIFY_20260910_CLINICAL_ENCOUNTER_RECORD_PRODUCTION.sql'
      - 'tests/sql/clinical_encounter_record_*.sql'
      - 'scripts/test-clinical-encounter-record-foundation.sh'
      - 'scripts/test-clinical-encounter-record-production-verifier.sh'
      - '.github/workflows/clinical-encounter-record-foundation.yml'
      - '.github/workflows/clinical-encounter-record-production-verifier.yml'
  workflow_dispatch:

jobs:
  encounter-record:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clinical_encounter_record_foundation_test

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated PostgreSQL 16 test database
        env:
          PGDATABASE: postgres
        run: createdb clinical_encounter_record_foundation_test

      - name: Run Encounter Clinical Record PostgreSQL 16 gate
        run: bash scripts/test-clinical-encounter-record-foundation.sh
