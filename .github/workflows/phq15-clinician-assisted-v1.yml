name: PHQ-15 Clinician-Assisted V1

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/clinical-instrument-engine.ts'
      - 'supabase/functions/nexus-self-assessment-processor/index.ts'
      - 'supabase-migrations/20260913_phq15_clinician_assisted_v1.sql'
      - 'supabase-verifiers/VERIFY_20260913_PHQ15_CLINICIAN_ASSISTED_V1.sql'
      - 'supabase-migrations/20260908_verify_nexus_c02_trusted_result_contract.sql'
      - 'supabase-migrations/20260908_verify_nexus_c03_clinical_lifecycle.sql'
      - 'supabase-migrations/20260908_verify_nexus_c04_clinical_record_incorporation.sql'
      - 'tests/sql/phq15_clinician_assisted_v1_cases.sql'
      - 'scripts/build-phq15-clinician-assisted-v1-sql-test.py'
      - 'scripts/test-phq15-clinician-assisted-v1.sh'
      - 'src/lib/nexus/clinicianAssistedInstrumentCatalog.ts'
      - 'src/lib/nexus/clinicianAssistedInstrumentCatalog.test.ts'
      - 'src/lib/nexus/publicSelfAssessmentCatalog.test.ts'
      - 'src/lib/clinicalInstrumentClinicianAssisted.ts'
      - 'src/lib/clinicalInstrumentClinicianAssisted.test.ts'
      - 'src/lib/clinicalInstrumentClinicianAssistedBoundary.test.js'
      - 'src/lib/clinicalInstrumentServerEngine.test.ts'
      - 'src/components/ClinicianAssistedInstrumentApplyNow.tsx'
      - '.github/workflows/phq15-clinician-assisted-v1.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/clinical-instrument-engine.ts'
      - 'supabase/functions/nexus-self-assessment-processor/index.ts'
      - 'supabase-migrations/20260913_phq15_clinician_assisted_v1.sql'
      - 'supabase-verifiers/VERIFY_20260913_PHQ15_CLINICIAN_ASSISTED_V1.sql'
      - 'scripts/test-phq15-clinician-assisted-v1.sh'
  workflow_dispatch:

jobs:
  phq15-postgres16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phq15_clinician_assisted_v1_test
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated PostgreSQL 16 database
        env:
          PGDATABASE: postgres
        run: createdb phq15_clinician_assisted_v1_test
      - name: Run PHQ-15 clinician-assisted gate
        run: bash scripts/test-phq15-clinician-assisted-v1.sh
