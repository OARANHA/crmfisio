name: Message Template Admin Boundary V1

on:
  pull_request:
    paths:
      - 'supabase-migrations/20260918_message_template_admin_boundary_v1.sql'
      - 'supabase-verifiers/VERIFY_20260918_MESSAGE_TEMPLATE_ADMIN_BOUNDARY_V1.sql'
      - 'supabase-verifiers/VERIFY_20260918_MESSAGE_TEMPLATE_ADMIN_BOUNDARY_V1_PRODUCTION.sql'
      - 'tests/sql/message_template_admin_boundary_v1_fixture.sql'
      - 'scripts/test-message-template-admin-boundary-v1.sh'
      - 'src/lib/messageOutbox.ts'
      - 'src/hooks/useMessageCenter.ts'
      - 'src/hooks/useMessageCenter.test.tsx'
      - 'src/pages/Mensagens.tsx'
      - 'src/components/configuration/ClinicCommunicationAdmin.tsx'
      - 'src/components/configuration/ClinicCommunicationAdmin.test.tsx'
      - 'src/lib/messageTemplateAdminBoundary.test.js'
      - '.github/workflows/message-template-admin-boundary-v1.yml'
  workflow_dispatch:

jobs:
  postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: message_template_admin_boundary_v1_test
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated database
        run: createdb -h localhost -U postgres message_template_admin_boundary_v1_test
      - name: Run message-template boundary verifier
        run: bash scripts/test-message-template-admin-boundary-v1.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: git diff --check