name: Clinical workflow CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - feature/clinical-workflow-premium

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
