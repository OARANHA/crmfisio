services:
  migrate:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: oaranha/crmfisio-migrate:latest
    restart: "no"
    environment:
      PGHOST: supabase-db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${SUPABASE_DB_PASSWORD}
    networks:
      - supabase-internal

  crmfisio:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: oaranha/crmfisio:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.crmfisio.rule=Host(`app.medicspro.com.br`)
      - traefik.http.routers.crmfisio.entrypoints=websecure
      - traefik.http.routers.crmfisio.tls=true
      - traefik.http.routers.crmfisio.tls.certresolver=letsencrypt
      - traefik.http.services.crmfisio.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
  supabase-internal:
    external: true
    name: supabase_default
